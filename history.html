<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ネオ・ミヤギ 小史</title>
<link rel="icon" href="data:,">
<style>
  :root { --bg: #0b1020; --panel: #121a30; --text: #e6edf5; --muted: #a9b6c8; --accent: #8fd0ff; --line: rgba(255,255,255,0.12); }
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Hiragino Sans", sans-serif; }
  body { background: radial-gradient(1200px 600px at 50% -200px, #1c2a52 0%, var(--bg) 70%) fixed; }
  main { max-width: 860px; margin: 0 auto; padding: 48px 20px 80px; line-height: 1.85; font-size: 16px; }
  h1 { font-size: 34px; margin: 0 0 12px; letter-spacing: 0.06em; }
  h2 { font-size: 22px; margin: 48px 0 12px; padding-bottom: 6px; border-bottom: 1px solid var(--line); color: var(--accent); }
  h3 { font-size: 18px; margin: 28px 0 6px; }
  p { margin: 8px 0; }
  blockquote { margin: 12px 0; padding: 8px 16px; border-left: 3px solid var(--accent); background: var(--panel); color: var(--muted); border-radius: 0 6px 6px 0; }
  table { border-collapse: collapse; width: 100%; margin: 12px 0; background: var(--panel); border-radius: 8px; overflow: hidden; }
  th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--accent); font-weight: 600; background: rgba(143,208,255,0.06); }
  ul { padding-left: 1.3em; }
  li { margin: 6px 0; }
  strong { color: #fff; }
  hr { border: none; border-top: 1px solid var(--line); margin: 36px 0; }
  .back { display: inline-block; margin-bottom: 24px; color: var(--accent); text-decoration: none; font-size: 14px; }
  .error { color: #ffb4a8; }
</style>
</head>
<body>
<main>
  <a class="back" href="./">← コロニーのデモへ</a>
  <div id="doc">読み込み中…</div>
</main>
<script>
// docs/history.md を読み込み、見出し・表・箇条書き・引用・強調だけの小さな変換器で表示する
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/`(.+?)`/g, '<code>$1</code>');
function render(md) {
  const lines = md.split('\n'), out = [];
  for (let i = 0; i < lines.length; i++) {
    const l = lines[i];
    if (/^#{1,3} /.test(l)) { const n = l.match(/^#+/)[0].length; out.push(`<h${n}>${inline(l.slice(n + 1))}</h${n}>`); }
    else if (/^---\s*$/.test(l)) out.push('<hr>');
    else if (/^> /.test(l)) out.push(`<blockquote>${inline(l.slice(2))}</blockquote>`);
    else if (/^\|/.test(l)) {
      const rows = [];
      while (i < lines.length && /^\|/.test(lines[i])) rows.push(lines[i++]);
      i--;
      const cells = r => r.replace(/^\||\|$/g, '').split('|').map(c => c.trim());
      const body = rows.slice(2).map(r => `<tr>${cells(r).map(c => `<td>${inline(c)}</td>`).join('')}</tr>`).join('');
      out.push(`<table><thead><tr>${cells(rows[0]).map(c => `<th>${inline(c)}</th>`).join('')}</tr></thead><tbody>${body}</tbody></table>`);
    } else if (/^- /.test(l)) {
      const items = [];
      while (i < lines.length && /^- /.test(lines[i])) items.push(`<li>${inline(lines[i++].slice(2))}</li>`);
      i--;
      out.push(`<ul>${items.join('')}</ul>`);
    } else if (l.trim()) out.push(`<p>${inline(l)}</p>`);
  }
  return out.join('\n');
}
fetch('docs/history.md').then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
  .then(md => { document.getElementById('doc').innerHTML = render(md); })
  .catch(e => { document.getElementById('doc').innerHTML = `<p class="error">docs/history.md を読み込めなかったのだ（${e.message}）。python3 -m http.server で開いてほしいのだ。</p>`; });
</script>
</body>
</html>
