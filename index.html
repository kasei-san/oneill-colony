<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>O'Neill Colony</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; font-family: system-ui, -apple-system, "Hiragino Sans", sans-serif; }
  canvas#view { display: block; cursor: grab; }
  canvas#view:active { cursor: grabbing; }
  .panel { position: fixed; background: rgba(10, 16, 28, 0.72); color: #e6edf5; border: 1px solid rgba(255,255,255,0.12); border-radius: 8px; padding: 10px 12px; font-size: 12px; line-height: 1.55; backdrop-filter: blur(4px); user-select: none; }
  #info { top: 12px; left: 12px; max-width: 300px; }
  #info h1 { font-size: 14px; margin: 0 0 6px; font-weight: 600; }
  #info .stat { font-variant-numeric: tabular-nums; color: #a9d1ff; }
  #info .keys { margin-top: 6px; color: #b9c4d0; }
  #warp { top: 12px; right: 12px; display: flex; flex-direction: column; gap: 4px; }
  #warp button { background: rgba(255,255,255,0.08); color: #e6edf5; border: 1px solid rgba(255,255,255,0.18); border-radius: 5px; padding: 5px 10px; font-size: 12px; cursor: pointer; text-align: left; }
  #warp button:hover { background: rgba(120,170,255,0.25); }
  #mapbox { left: 12px; bottom: 12px; }
  #mapbox canvas { display: block; cursor: crosshair; border-radius: 4px; }
  #mapbox .cap { margin-bottom: 4px; color: #b9c4d0; }
  #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: #cfe0f5; font-size: 16px; background: #000; z-index: 10; }
  .hidden { display: none !important; }
  #demo-cap { position: fixed; left: 50%; bottom: 44px; transform: translateX(-50%); width: min(820px, calc(100% - 32px)); color: #f2f6fb; text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    background: linear-gradient(180deg, rgba(6,10,20,0.15), rgba(6,10,20,0.72)); border-radius: 10px; padding: 14px 20px 16px; transition: opacity 0.9s; opacity: 0; pointer-events: none; }
  #demo-cap .ch { font-size: 12px; letter-spacing: 0.12em; color: #9fd0ff; }
  #demo-cap h2 { margin: 4px 0 6px; font-size: 22px; font-weight: 700; }
  #demo-cap p { margin: 0; font-size: 15px; line-height: 1.75; }
  #demo-fade { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity 0.8s; }
  #demo-bar { position: fixed; right: 16px; bottom: 10px; color: #c8d4e2; font-size: 12px; background: rgba(6,10,20,0.65); padding: 4px 6px 4px 10px; border-radius: 8px; display: flex; align-items: center; gap: 6px; }
  #demo-bar button { background: rgba(255,255,255,0.1); color: #e6edf5; border: 1px solid rgba(255,255,255,0.25); border-radius: 5px; min-width: 30px; height: 26px; font-size: 13px; cursor: pointer; }
  #demo-bar button:hover { background: rgba(120,170,255,0.3); }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="loading">コロニーを建設中…</div>
<div id="info" class="panel">
  <h1>O'Neill Colony（島3号型）</h1>
  <div>場所: <span class="stat" id="s-loc">-</span></div>
  <div>高度: <span class="stat" id="s-alt">-</span> / 速度: <span class="stat" id="s-spd">-</span></div>
  <div>FPS: <span class="stat" id="s-fps">-</span></div>
  <div>サウンド: <span class="stat" id="s-snd">クリックかキー入力で開始</span></div>
  <div class="keys">
    ドラッグ: 視点 / WASD・矢印: 移動<br>
    Shift: 高速 / E・Space: 上昇 / Q・C: 下降<br>
    [ / ]: 画角 / B: ポストエフェクト切替 / T: トーンマップ ACES⇔AgX<br>
    O: 宇宙から見る（ドラッグ・ホイール） / N: 昼⇔夜 / M: 音のミュート / H: パネル表示切替 / 左下の地図クリック: ワープ
  </div>
</div>
<div id="warp" class="panel"></div>
<div id="demo-fade"></div>
<div id="demo-cap"><div class="ch"></div><h2></h2><p></p></div>
<div id="demo-bar" class="hidden"><span id="demo-pos"></span><button id="demo-prev" title="前へ（←）">⏮</button><button id="demo-pause" title="一時停止（Space）">⏸</button><button id="demo-next" title="次へ（→）">⏭</button><button id="demo-stop" title="終了（Esc）">✕</button></div>
<div id="mapbox" class="panel">
  <div class="cap">展開図（横=周方向 360° / 縦=軸方向）</div>
  <canvas id="minimap" width="360" height="306"></canvas>
</div>

<script type="module">
import * as THREE from 'three';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { FullScreenQuad } from 'three/addons/postprocessing/Pass.js';

const LOW = new URLSearchParams(location.search).get('q') === 'low';

// ===== コロニー寸法（メートル）。軸は Z、遠心「重力」は軸から外向き =====
const R = 3000, L = 16000, HL = L / 2;
const SECTOR = Math.PI / 3;              // 陸地3枚・窓3枚を60°ずつ交互に配置
const STRIP_W = R * SECTOR;              // 陸地1枚の幅（弧長）
const P = 110, ROAD = 16, BLK = P - ROAD; // 街区ピッチ・道路幅・街区内寸
const NS = Math.floor(STRIP_W / P), NZ = Math.floor(L / P);
const GLASS_R = R + 25;                  // 窓ガラスは地面より25m外側
const STRIP_PHI = [0, 1, 2].map(k => (30 + 120 * k) * Math.PI / 180);
const WIN_PHI = STRIP_PHI.map(p => p + SECTOR);
const sCenter = i => (i - (NS - 1) / 2) * P;
const zCenter = j => (j - (NZ - 1) / 2) * P;
const BRIDGE_Z = [];
for (let j = 6; j < NZ - 1; j += 10) BRIDGE_Z.push(zCenter(j) + P / 2);
const RIVER_I = [7, 20, 10];
const RESORT = { k: 1, i0: NS - 6, j0: 35, j1: 42 };
const RIVERSIDE = { k: 2, j0: 74, j1: 82 };                  // 屋台が並ぶ川沿い（川の両岸の遊歩道、9ブロック分）
const RIVER_HW = 32;                                          // 川の水面の半幅（両岸に遊歩道を残す）   // 観覧車と遊園地のエリア（第2陸地の東端）

function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rand = mulberry32(20261001);
const rr = (a, b) => a + (b - a) * rand();
const pick = arr => arr[Math.floor(rand() * arr.length)];
const TAU = Math.PI * 2;
const normAng = a => ((a % TAU) + TAU) % TAU;
const angDiff = (a, b) => { let d = normAng(a - b); return d > Math.PI ? d - TAU : d; };
const stripOf = th => Math.floor((normAng(th) + Math.PI / 6) / (TAU / 3)) % 3;
const isLand = th => Math.abs(angDiff(th, STRIP_PHI[stripOf(th)])) < SECTOR / 2;

// 円筒上の局所フレーム（x=東(θ増加方向), y=上(軸方向へ), z=北(+Z)）に箱を置く行列
function writeBox(a, o, th, z, h0, w, ht, d) {
  const c = Math.cos(th), s = Math.sin(th), r = R - h0;
  a[o] = -s * w; a[o + 1] = c * w; a[o + 2] = 0; a[o + 3] = 0;
  a[o + 4] = -c * ht; a[o + 5] = -s * ht; a[o + 6] = 0; a[o + 7] = 0;
  a[o + 8] = 0; a[o + 9] = 0; a[o + 10] = d; a[o + 11] = 0;
  a[o + 12] = r * c; a[o + 13] = r * s; a[o + 14] = z; a[o + 15] = 1;
}
const _m = new THREE.Matrix4();
const boxMatrix = (th, z, h0, w, ht, d) => { writeBox(_m.elements, 0, th, z, h0, w, ht, d); return _m; };
const cyl = (r, th, z) => new THREE.Vector3(r * Math.cos(th), r * Math.sin(th), z);

// ===== レンダラ =====
const renderer = new THREE.WebGLRenderer({ antialias: false, logarithmicDepthBuffer: true, powerPreference: 'high-performance' });
renderer.domElement.id = 'view';
renderer.setPixelRatio(Math.min(devicePixelRatio, LOW ? 1 : 1.5));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const ANISO = renderer.capabilities.getMaxAnisotropy();

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.FogExp2(new THREE.Color(0xbcd0e8), 3.3e-4); // 密度は colonyFog の「地表換算距離」に掛ける係数
const camera = new THREE.PerspectiveCamera(80, innerWidth / innerHeight, 0.5, 600000); // 遠くの僚コロニーまで描くため遠め

// ===== 照明: 各陸地は「向かいの窓」から鏡で反射した太陽光を受ける =====
const sunL = STRIP_PHI.map(p => new THREE.Vector3(-Math.cos(p), -Math.sin(p), 0)
  .addScaledVector(new THREE.Vector3(-Math.sin(p), Math.cos(p), 0), 0.25)
  .add(new THREE.Vector3(0, 0, -0.3)).normalize());
// 円筒用の空気遠近法: 霧の濃さを「軸からの距離（=高度）」で決め、視線に沿って積分する。
// 地表付近は濃く軸付近は薄い。遠いほど青く霞み、太陽（採光窓）の方向は暖色に光る。
{
  const v = l => `vec3(${l.x.toFixed(5)}, ${l.y.toFixed(5)}, ${l.z.toFixed(5)})`;
  THREE.ShaderChunk.fog_pars_vertex = `#ifdef USE_FOG
    varying float vFogDepth; varying vec3 vFogWorld;
  #endif`;
  THREE.ShaderChunk.fog_vertex = `#ifdef USE_FOG
    vFogDepth = - mvPosition.z;
    vFogWorld = cameraPosition + transpose(mat3(viewMatrix)) * mvPosition.xyz;
  #endif`;
  THREE.ShaderChunk.fog_pars_fragment = `#ifdef USE_FOG
    uniform vec3 fogColor; varying float vFogDepth; varying vec3 vFogWorld;
    #ifdef FOG_EXP2
      uniform float fogDensity;
    #else
      uniform float fogNear; uniform float fogFar;
    #endif
    float colonyFogDens(vec3 p) { float r = length(p.xy); if (r > ${GLASS_R.toFixed(1)} || abs(p.z) > ${HL.toFixed(1)}) return 0.0; return 0.3 + 0.7 * exp(-max(${R.toFixed(1)} - r, 0.0) / 1000.0); } // 外の宇宙は霧なし
  #endif`;
  THREE.ShaderChunk.fog_fragment = `#ifdef USE_FOG
    vec3 fogD = vFogWorld - cameraPosition;
    float fogL = length(fogD), fogDe = 0.0;
    for (int fi = 0; fi < 8; fi++) fogDe += colonyFogDens(cameraPosition + fogD * ((float(fi) + 0.5) / 8.0));
    fogDe *= fogL / 8.0;
    #ifdef FOG_EXP2
      vec3 fogT = fogDe * fogDensity * vec3(0.82, 0.95, 1.12);
    #else
      vec3 fogT = vec3(fogDe / fogFar);
    #endif
    vec3 fogF = 1.0 - exp(-fogT * fogT);
    float fogFactor = dot(fogF, vec3(1.0 / 3.0));
    float fogAng = atan(cameraPosition.y, cameraPosition.x);
    float fogK = mod(floor((fogAng + 0.5235988) / 2.0943951), 3.0);
    vec3 fogSun = fogK < 0.5 ? ${v(sunL[0])} : (fogK < 1.5 ? ${v(sunL[1])} : ${v(sunL[2])});
    float fogMie = pow(max(dot(fogD / max(fogL, 1e-3), fogSun), 0.0), 6.0) * smoothstep(0.08, 0.5, dot(fogColor, vec3(0.333)));
    vec3 fogCol = fogColor + vec3(1.0, 0.82, 0.58) * fogMie * 0.9;
    gl_FragColor.rgb = gl_FragColor.rgb * (1.0 - fogF) + fogCol * fogF;
  #endif`;
}

const U = {
  uSunL: { value: sunL },
  uSkyAmb: { value: new THREE.Color(0.40, 0.48, 0.60) },
  uGndAmb: { value: new THREE.Color(0.20, 0.19, 0.17) },
  uDetail: { value: null },
  uEnv: { value: null },
  uTime: { value: 0 },
  uParks: { value: Array.from({ length: 6 }, () => new THREE.Vector4(9, 9, 0, 0)) }, // 大きな公園の範囲（角度・z）
  uNight: { value: 0 },  // 0=昼, 1=夜
  uSpace: { value: 0 },  // 1=宇宙から見ている（道路の光・ガラスの映り込みを抑える）
};
const sun = new THREE.DirectionalLight(0xfff2e0, 3.3);
sun.castShadow = true;
sun.shadow.mapSize.set(LOW ? 2048 : 4096, LOW ? 2048 : 4096);
sun.shadow.camera.up.set(0, 0, 1); // 既定の Y-up だと真上から照らす陸地で lookAt が縮退する
sun.shadow.camera.near = 1500; sun.shadow.camera.far = 3400;
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.6;
scene.add(sun, sun.target);

// 標準マテリアルに「位置ごとの太陽方向」「円筒用の半球環境光」などを注入する
function patch(mat, opts = {}) {
  const key = 'colony-' + (opts.building ? 'b' : '') + (opts.ground ? 'g' : '') + (opts.wind ? 'w' : '') + (opts.vehicle ? 'v' : '') + (opts.carGlow ? 'c' : '');
  mat.customProgramCacheKey = () => key;
  mat.onBeforeCompile = sh => {
    sh.uniforms.uSunL = U.uSunL; sh.uniforms.uSkyAmb = U.uSkyAmb; sh.uniforms.uGndAmb = U.uGndAmb; sh.uniforms.uNight = U.uNight; sh.uniforms.uSpace = U.uSpace;
    if (opts.ground) { sh.uniforms.uDetail = U.uDetail; sh.uniforms.uNeon = { value: mat.userData.neon }; }
    if (opts.carGlow) {
      sh.vertexShader = 'attribute vec3 aGlow; varying vec3 vGlow;\n' + sh.vertexShader.replace('#include <begin_vertex>', '#include <begin_vertex>\n vGlow = aGlow;');
      sh.fragmentShader = 'varying vec3 vGlow;\n' + sh.fragmentShader.replace('#include <emissivemap_fragment>', '#include <emissivemap_fragment>\n totalEmissiveRadiance += vGlow * (0.3 + 5.0 * uNight);');
    }
    if (opts.wind) {
      sh.uniforms.uTime = U.uTime; sh.uniforms.uParks = U.uParks;
      // 幹はインスタンスの葉の色を掛けず、元の茶色のまま（ライトアップで緑の幹にならないように）
      sh.vertexShader = 'attribute float aTrunk;\n' + sh.vertexShader.replace('#include <color_vertex>', '#include <color_vertex>\n #ifdef USE_COLOR\n vColor.rgb = mix(vColor.rgb, color.rgb, aTrunk);\n #endif');
      // 大きな公園の中の木は、夜に足元から暖色のスポットライトで照らす
      sh.fragmentShader = 'uniform vec4 uParks[6];\n' + sh.fragmentShader.replace('#include <emissivemap_fragment>', `#include <emissivemap_fragment>
        if (uNight > 0.01) {
          float pa = atan(vCW.y, vCW.x), inPark = 0.0;
          for (int pi = 0; pi < 6; pi++) { vec4 pr = uParks[pi]; inPark = max(inPark, step(pr.x, pa) * step(pa, pr.y) * step(pr.z, vCW.z) * step(vCW.z, pr.w)); }
          float hgt = ${R.toFixed(1)} - length(vCW.xy);
          totalEmissiveRadiance += uNight * inPark * diffuseColor.rgb * vec3(1.0, 0.72, 0.42) * 0.9 * smoothstep(14.0, 2.0, hgt) * (0.6 + 0.4 * fract(sin(dot(floor(vCW.xz * 0.08), vec2(12.9, 78.2))) * 43758.5)); // 下ほど明るく、木ごとにむら
        }`);
      // 風: 高い所ほど大きく、木ごとに位相をずらして揺らす（単位座標なので幹の根元は動かない）
      sh.vertexShader = 'uniform float uTime;\n' + sh.vertexShader.replace('#include <begin_vertex>', `#include <begin_vertex>
        { float ph = 0.0;
        #ifdef USE_INSTANCING
          ph = dot(instanceMatrix[3].xyz, vec3(0.013, 0.017, 0.011));   // 木ごとに揺れの位相をずらす
        #endif
          float sw = (sin(uTime * 1.3 + ph) * 0.6 + sin(uTime * 3.1 + ph * 2.7) * 0.25) * position.y * position.y;
          transformed.x += sw * 0.05; transformed.z += sw * 0.035 * cos(uTime * 0.7 + ph); }`);
    }
    let vs = 'varying vec3 vCW;\n'
      + (opts.building ? 'varying vec3 vBL; varying vec3 vBN; varying vec3 vBS; varying vec3 vVL; varying float vBId;\n' : '')
      + (opts.ground ? 'attribute vec2 duv; varying vec2 vDuv;\n' : '') + sh.vertexShader;
    vs = vs.replace('#include <project_vertex>', `#include <project_vertex>
      { vec4 cw = vec4(transformed, 1.0);
      #ifdef USE_INSTANCING
        cw = instanceMatrix * cw;
      #endif
        vCW = (modelMatrix * cw).xyz; }
      ${opts.building ? `
        vBS = vec3(length(instanceMatrix[0].xyz), length(instanceMatrix[1].xyz), length(instanceMatrix[2].xyz));
        vBL = position * vBS; vBN = normal;
        { vec3 vw = (modelMatrix * instanceMatrix * vec4(transformed, 1.0)).xyz - cameraPosition;
          vVL = vec3(dot(vw, instanceMatrix[0].xyz) / vBS.x, dot(vw, instanceMatrix[1].xyz) / vBS.y, dot(vw, instanceMatrix[2].xyz) / vBS.z);
          ${opts.vehicle ? 'vBId = fract(float(gl_InstanceID) * 0.6180339);' : 'vec3 q = fract(instanceMatrix[3].xyz * 0.1031); q += dot(q, q.zyx + 31.32); vBId = fract((q.x + q.y) * q.z);'} }` : ''}
      ${opts.ground ? 'vDuv = duv;' : ''}`);
    let fs = `varying vec3 vCW; uniform vec3 uSunL[3]; uniform vec3 uSkyAmb; uniform vec3 uGndAmb; uniform float uNight; uniform float uSpace;
      ${opts.building ? `varying vec3 vBL; varying vec3 vBN; varying vec3 vBS; varying vec3 vVL; varying float vBId;
        float bHash(vec3 p) { p = fract(p * 0.1031); p += dot(p, p.zyx + 31.32); return fract((p.x + p.y) * p.z); }
        float bNoise(vec2 p) { vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
          return mix(mix(bHash(vec3(i, 0.0)), bHash(vec3(i + vec2(1, 0), 0.0)), f.x), mix(bHash(vec3(i + vec2(0, 1), 0.0)), bHash(vec3(i + vec2(1, 1), 0.0)), f.x), f.y); }` : ''}
      ${opts.ground ? 'uniform sampler2D uDetail; uniform sampler2D uNeon; varying vec2 vDuv;' : ''}
      vec3 colonySunDir() {
        float ang = atan(vCW.y, vCW.x);
        float k = mod(floor((ang + 0.5235988) / 2.0943951), 3.0);
        vec3 l = k < 0.5 ? uSunL[0] : (k < 1.5 ? uSunL[1] : uSunL[2]);
        return normalize((viewMatrix * vec4(l, 0.0)).xyz);
      }\n` + sh.fragmentShader;
    fs = fs.replace('#include <lights_fragment_begin>', THREE.ShaderChunk.lights_fragment_begin.replace(
      'getDirectionalLightInfo( directionalLight, directLight );',
      'getDirectionalLightInfo( directionalLight, directLight ); directLight.direction = colonySunDir();'));
    if (opts.ground) {
      fs = fs.replace('#include <emissivemap_fragment>', `#include <emissivemap_fragment>
        if (uNight > 0.001) {
          // 遠景用: 街区の中にランダムな明かりの点（低いビルや家の窓のかわり）。公園(緑)と川(青)は除く
          { vec3 bc = diffuseColor.rgb;
            float built = (1.0 - step(bc.r * 1.12, bc.g)) * (1.0 - step(bc.r * 1.25, bc.b));
            vec2 lc = vDuv * 12.0, lfw = fwidth(lc);
            vec2 cell = floor(lc);
            vec3 q = fract(vec3(cell, 3.7) * 0.1031); q += dot(q, q.zyx + 31.32); float hh = fract((q.x + q.y) * q.z);
            float spot = step(0.8, hh) * (1.0 - smoothstep(0.15, 0.35, length(fract(lc) - 0.5)));
            float lt = mix(spot * (0.6 + 2.0 * (hh - 0.8)), 0.045, smoothstep(0.4, 1.2, max(lfw.x, lfw.y)));
            totalEmissiveRadiance += uNight * built * lt * vec3(1.0, 0.78, 0.5) * 1.6; }
          vec2 fd = abs(fract(vDuv + 0.5) - 0.5);                  // 街区タイル端（=道路中心）までの距離
          float road = 1.0 - smoothstep(0.06, 0.075, min(fd.x, fd.y));
          float along = fd.x < fd.y ? vDuv.y : vDuv.x;
          float lamp = pow(0.5 + 0.5 * cos(along * 6.2832 * 4.4), 6.0); // 約25mおきの街灯の光だまり
          totalEmissiveRadiance += uNight * road * (0.03 + 0.35 * lamp) * vec3(1.0, 0.72, 0.4) * mix(1.0, 0.2, uSpace);
          // 歓楽街: 道路がピンク〜水色のネオンに染まる
          float neon = texture2D(uNeon, vec2((vDuv.x + ${(NS / 2).toFixed(1)}) / ${NS.toFixed(1)}, (vDuv.y + ${((NZ - 1) / 2).toFixed(1)}) / ${NZ.toFixed(1)})).r;
          if (neon > 0.01) {
            vec3 nc = mix(vec3(1.0, 0.15, 0.7), vec3(0.1, 0.8, 1.0), 0.5 + 0.5 * sin(vDuv.x * 2.1 + vDuv.y * 1.7));
            totalEmissiveRadiance += uNight * neon * nc * (road * (0.22 + 0.55 * lamp) + 0.05) * mix(1.0, 0.3, uSpace);
          }
        }`);
      fs = fs.replace('#include <map_fragment>', `#include <map_fragment>
        { vec4 dt = texture2D(uDetail, vDuv);
          float fade = clamp(1.0 - length(vViewPosition) / 2500.0, 0.0, 1.0);
          vec3 b = diffuseColor.rgb * (dt.r * 2.0);
          b = mix(b, vec3(0.75), dt.b);
          diffuseColor.rgb = mix(diffuseColor.rgb, b, fade); }`);
    }
    if (opts.building) {
      fs = fs.replace('#include <color_fragment>', `#include <color_fragment>
        float winMask = 0.0; vec3 winRoom = vec3(0.0);
        // 建物ごとの色ムラと低周波の汚れ
        diffuseColor.rgb *= 0.88 + 0.22 * vBId;
        ${opts.vehicle ? '' : 'diffuseColor.rgb *= 0.9 + 0.2 * bNoise(vCW.xy * 0.05 + vCW.z * 0.03 + vBId * 17.0);'}
        if (abs(vBN.y) < 0.5) {
          bool xFace = abs(vBN.x) > 0.5;
          float hc = xFace ? vBL.z : vBL.x, halfW = 0.5 * (xFace ? vBS.z : vBS.x);
          vec2 g = vec2(hc / 3.2, vBL.y / 3.6);
          vec2 f = fract(g);
          vec2 fw = max(fwidth(g), vec2(1e-4));
          float mx = smoothstep(0.15 - fw.x, 0.15 + fw.x, f.x) - smoothstep(0.85 - fw.x, 0.85 + fw.x, f.x);
          float my = smoothstep(0.28 - fw.y, 0.28 + fw.y, f.y) - smoothstep(0.88 - fw.y, 0.88 + fw.y, f.y);
          float m = clamp(mx, 0.0, 1.0) * clamp(my, 0.0, 1.0);
          m *= step(1.0, halfW - abs(hc)) * step(vBL.y, vBS.y - 1.0); // 角と屋上の縁には窓を作らない
          float lod = smoothstep(0.35, 0.9, max(fw.x, fw.y));
          winMask = mix(m, 0.42, lod);
          // 窓の奥の部屋（interior mapping）: 窓セルの奥に箱部屋があるとしてレイを飛ばす
          if (m > 0.01 && lod < 0.99) {
            vec3 dv = normalize(vVL);
            vec3 d = vec3(dot(dv, xFace ? vec3(0.0, 0.0, 1.0) : vec3(1.0, 0.0, 0.0)), dv.y, dot(dv, -vBN));
            vec3 room = vec3(3.2, 3.6, 5.0), p0 = vec3(f.x * 3.2, f.y * 3.6, 0.0);
            vec3 tt = (step(0.0, d) * room - p0) / d;
            float t = min(min(tt.x, tt.y), tt.z);
            vec3 hp = p0 + d * t;
            float rid = bHash(vec3(floor(g), vBId * 131.0));
            vec3 c = t == tt.z ? mix(vec3(0.75, 0.68, 0.58), vec3(0.55, 0.62, 0.70), rid)   // 奥の壁
                   : t == tt.y ? (d.y > 0.0 ? vec3(0.9, 0.9, 0.86) : vec3(0.32, 0.25, 0.2)) // 天井 / 床
                   : vec3(0.62, 0.6, 0.56);                                                   // 横の壁
            c *= mix(1.0, 0.55, hp.z / room.z);
            float on = ${opts.vehicle ? '1.0' : 'step(mix(0.3, 0.55, uNight), rid)'};   // 夜は約半分の部屋だけ点灯（電車は全部）
            winRoom = c * mix(vec3(1.0), vec3(1.2, 0.95, 0.66), uNight) * mix(mix(0.25, 1.0, on), on, uNight);
          }
          // 遠くは部屋の計算をせず、平均的な明るさ（建物ごとに少しばらつく）で光らせる
          // 遠くは窓をまとめたブロック単位でランダムに点灯（距離に応じてブロックを大きくする）
          { float lv = clamp(floor(log2(max(max(fw.x, fw.y), 1e-3) * 1.5)) + 1.0, 0.0, 6.0);
            vec2 cid = floor(g / exp2(lv));
            float onF = ${opts.vehicle ? '1.0' : 'step(mix(0.3, 0.55, uNight), bHash(vec3(cid, vBId * 91.0 + lv)))'};
            vec3 farRoom = vec3(0.75, 0.6, 0.42) * (0.5 + 0.6 * bHash(vec3(cid + 7.0, vBId * 13.0))) * mix(0.6, onF * 1.5, uNight);
            winRoom = mix(winRoom, farRoom, lod); }
          float rnd = bHash(vec3(floor(g), vBId * 57.0));
          diffuseColor.rgb = mix(diffuseColor.rgb, mix(vec3(0.16, 0.19, 0.24), vec3(0.42, 0.47, 0.54), rnd * rnd), winMask);
          // 角・屋上の縁を明るく（面取りの代わり）
          float eDist = min(halfW - abs(hc), vBS.y - vBL.y);
          float eW = max(0.3, fwidth(hc) * 1.5);
          diffuseColor.rgb *= 1.0 + 0.3 * (1.0 - smoothstep(0.0, eW, eDist)) * (1.0 - winMask);
          // 足元ほど暗く（接地AO）
          diffuseColor.rgb *= mix(0.5, 1.0, smoothstep(0.0, 7.0, vBL.y));
        } else if (vBN.y > 0.5) {
          float eDist = min(0.5 * vBS.x - abs(vBL.x), 0.5 * vBS.z - abs(vBL.z));
          diffuseColor.rgb *= 0.8 * (1.0 + 0.35 * (1.0 - smoothstep(0.0, max(0.6, fwidth(vBL.x) * 2.0), eDist)));
        }`);
      fs = fs.replace('#include <roughnessmap_fragment>', `#include <roughnessmap_fragment>
        roughnessFactor = mix(roughnessFactor, 0.05, winMask);`);
      fs = fs.replace('#include <metalnessmap_fragment>', `#include <metalnessmap_fragment>
        metalnessFactor = mix(metalnessFactor, 0.5, winMask);`);
      // 部屋の明かりは自発光扱い。斜めから見るほど反射に負けて見えなくなる
      fs = fs.replace('#include <emissivemap_fragment>', `#include <emissivemap_fragment>
        totalEmissiveRadiance += winRoom * winMask * mix(1.0, 1.4, uNight) * (1.0 - (1.0 - uNight) * pow(1.0 - abs(dot(normal, normalize(vViewPosition))), 2.0));`);
    }
    fs = fs.replace('#include <opaque_fragment>', `{
        vec3 upW = -normalize(vec3(vCW.xy, 0.0) + vec3(1e-5));
        vec3 upV = normalize((viewMatrix * vec4(upW, 0.0)).xyz);
        float hk = dot(normal, upV) * 0.5 + 0.5;
        outgoingLight += diffuseColor.rgb * mix(uGndAmb, uSkyAmb, hk) * (1.0 - metalnessFactor);
        // 照り返し: 太陽と反対の水平方向から、地面に反射した弱い暖色光
        vec3 sunV = colonySunDir(), bounceV = sunV - upV * dot(sunV, upV);
        bounceV = -normalize(bounceV + upV * 1e-4);
        outgoingLight += diffuseColor.rgb * vec3(0.32, 0.26, 0.2) * max(dot(normal, bounceV), 0.0) * (1.0 - metalnessFactor) * 0.5;
      }
      #include <opaque_fragment>`);
    sh.vertexShader = vs; sh.fragmentShader = fs;
  };
  return mat;
}

function canvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return [c, c.getContext('2d')]; }

// 街区1つ分の近景ディテール（R=明度倍率, B=白線マスク）。1タイル=1街区で繰り返す
function makeDetailTex() {
  const S = 256, rp = (ROAD / 2) / P * S, sw = 3.5 / P * S;
  const [ca, a] = canvas(S, S), [cb, b] = canvas(S, S);
  a.fillStyle = 'rgb(128,128,128)'; a.fillRect(0, 0, S, S);
  for (let n = 0; n < 4000; n++) { const v = 118 + Math.random() * 20 | 0; a.fillStyle = `rgb(${v},${v},${v})`; a.fillRect(Math.random() * S, Math.random() * S, 2, 2); }
  const wrapRect = (g, x, y, w, h) => { for (const ox of [-S, 0, S]) for (const oy of [-S, 0, S]) g.fillRect(x + ox, y + oy, w, h); };
  // 歩道（明るめ）
  a.fillStyle = 'rgb(165,165,165)';
  wrapRect(a, -rp, 0, 2 * rp, S); wrapRect(a, 0, -rp, S, 2 * rp);
  // 車道（アスファルト）
  const road = rp - sw;
  a.fillStyle = 'rgb(122,122,122)';
  wrapRect(a, -road, 0, 2 * road, S); wrapRect(a, 0, -road, S, 2 * road);
  for (let n = 0; n < 3000; n++) {
    const v = 105 + Math.random() * 35 | 0; a.fillStyle = `rgb(${v},${v},${v})`;
    const t = Math.random() * S, o = (Math.random() * 2 - 1) * road;
    if (Math.random() < 0.5) a.fillRect(o < 0 ? S + o : o, t, 1, 1); else a.fillRect(t, o < 0 ? S + o : o, 1, 1);
  }
  // 歩道の目地
  a.fillStyle = 'rgb(140,140,140)';
  for (let t = 0; t < S; t += 6) { wrapRect(a, road, t, sw, 1); wrapRect(a, -rp, t, sw, 1); wrapRect(a, t, road, 1, sw); wrapRect(a, t, -rp, 1, sw); }
  // 白線: 中央破線・横断歩道
  b.fillStyle = '#000'; b.fillRect(0, 0, S, S); b.fillStyle = '#fff';
  for (let t = rp + 6; t < S - rp - 6; t += 14) { wrapRect(b, -1, t, 2, 7); wrapRect(b, t, -1, 7, 2); }
  for (let x = -road + 2; x < road - 2; x += 4) { wrapRect(b, x, rp + 1, 2, 9); wrapRect(b, x, S - rp - 10, 2, 9); wrapRect(b, rp + 1, x, 9, 2); wrapRect(b, S - rp - 10, x, 9, 2); }
  const da = a.getImageData(0, 0, S, S).data, db = b.getImageData(0, 0, S, S).data;
  const out = new Uint8Array(S * S * 4);
  for (let p = 0; p < S * S * 4; p += 4) { out[p] = da[p]; out[p + 1] = da[p]; out[p + 2] = db[p]; out[p + 3] = 255; }
  const tex = new THREE.DataTexture(out, S, S, THREE.RGBAFormat);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping; tex.anisotropy = ANISO;
  tex.magFilter = THREE.LinearFilter; tex.minFilter = THREE.LinearMipmapLinearFilter; tex.generateMipmaps = true;
  tex.needsUpdate = true;
  return tex;
}
U.uDetail.value = makeDetailTex();

function gradientSprite(stops) {
  const [c, g] = canvas(256, 256);
  const gr = g.createRadialGradient(128, 128, 0, 128, 128, 128);
  for (const [o, col] of stops) gr.addColorStop(o, col);
  g.fillStyle = gr; g.fillRect(0, 0, 256, 256);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}

M.water.normalMap = (() => {
  const S = 256, h = new Float32Array(S * S), out = new Uint8Array(S * S * 4);
  const waves = Array.from({ length: 14 }, () => [1 + Math.floor(rand() * 9), Math.floor(rand() * 9) - 4, rand() * TAU, 0.3 + rand()]);
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    let v = 0; for (const [fx, fy, ph, a] of waves) v += a / (fx + Math.abs(fy)) * Math.sin(TAU * (fx * x + fy * y) / S + ph);
    h[y * S + x] = v;
  }
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    const dx = h[y * S + (x + 1) % S] - h[y * S + (x + S - 1) % S], dy = h[((y + 1) % S) * S + x] - h[((y + S - 1) % S) * S + x];
    const n = new THREE.Vector3(-dx * 6, -dy * 6, 1).normalize(), o = (y * S + x) * 4;
    out[o] = (n.x * 0.5 + 0.5) * 255; out[o + 1] = (n.y * 0.5 + 0.5) * 255; out[o + 2] = (n.z * 0.5 + 0.5) * 255; out[o + 3] = 255;

})();

const GEO = {

  saw: (() => {
    const p = [], N = 4, w = 1 / N;
    for (let i = 0; i < N; i++) {
      const x0 = -0.5 + i * w, x1 = x0 + w;
      const q = (a, b, c, d) => p.push(...a, ...b, ...c, ...a, ...c, ...d);
      q([x0, 0, -0.5], [x0, 0, 0.5], [x1, 1, 0.5], [x1, 1, -0.5]);      // 斜面
      q([x1, 1, -0.5], [x1, 1, 0.5], [x1, 0, 0.5], [x1, 0, -0.5]);      // 垂直面（ガラス）
      p.push(x0, 0, -0.5, x1, 1, -0.5, x1, 0, -0.5, x0, 0, 0.5, x1, 0, 0.5, x1, 1, 0.5); // 妻側

    const colorize = (g, c) => { const n = g.attributes.position.count, a = new Float32Array(n * 3); for (let i = 0; i < n; i++) a.set(c, i * 3); g.setAttribute('color', new THREE.BufferAttribute(a, 3)); return g; };

    return markTrunk(mergeGeometries([trunk, crown]));
  })(),
};

function genStrip(k) {
  const phi = STRIP_PHI[k], river = RIVER_I[k];
  const [cv, g] = canvas(512, 2560);
  g.setTransform(cv.width / STRIP_W, 0, 0, cv.height / L, cv.width / 2, cv.height / 2);
  g.fillStyle = '#a39c8f'; g.fillRect(-STRIP_W / 2, -HL, STRIP_W, L);
  g.fillStyle = '#44474c'; g.fillRect(-NS * P / 2 - ROAD / 2, -HL, NS * P + ROAD, L);

  const cbds = [];
  for (let n = 0; n < 3; n++) { let s; do { s = rr(-900, 900); } while (Math.abs(s - sCenter(river)) < 250); cbds.push({ s, z: -6000 + n * 6000 + rr(-1500, 1500) }); }
  const bigParks = [];
  for (let n = 0; n < 2; n++) {
    let i0; do { i0 = 2 + Math.floor(rand() * (NS - 7)); } while (river >= i0 - 1 && river <= i0 + 4);
    bigParks.push({ i0, i1: i0 + 3, j0: 20 + n * 70 + Math.floor(rand() * 30), nj: 5 });
  }
  bigParks.forEach(p => { p.j1 = p.j0 + p.nj - 1; });
  const cbdF = (s, z) => Math.max(...cbds.map(c => Math.exp(-(((z - c.z) / 1600) ** 2) - (((s - c.s) / 650) ** 2))));
  let tallest = { h: 0 };
  // 横線路（環状線）と縦線路（陸地中央の高架線）の交差点＝ターミナル駅。性格はランダム:
  // 4割 オフィス街 / 2割5分 歓楽街 / 残りは発展していない（まわりは元の住宅地や公園のまま）
  const terms = BRIDGE_Z.map(zb => { const r = rand(); return { z: zb, kind: r < 0.4 ? 'office' : r < 0.65 ? 'neon' : 'plain', r: rr(260, 420) }; });
  (landmarks.terminals ??= [])[k] = terms;
  const nearPlainTerm = (s, z) => terms.some(t => t.kind === 'plain' && Math.hypot(s, z - t.z) < 260);
  landmarks.samples ??= {};
  const termAt = (s, z) => { for (const t of terms) { const d = Math.hypot(s, z - t.z); if (d < t.r && t.kind !== 'plain') return { t, f: 1 - d / t.r }; } return null; };
  // 工業地帯: 窓際の片側にまとまった地区を3か所（半径450〜650m）
  const indZ = Array.from({ length: 3 }, (_, n) => ({ z: -5200 + n * 5200 + rr(-900, 900), side: rand() < 0.5 ? -1 : 1, r: rr(450, 650) }));

  landmarks.parks[k] = bigParks.map(p => ({ s: (sCenter(p.i0) + sCenter(p.i1)) / 2, z: (zCenter(p.j0) + zCenter(p.j1)) / 2 }));
  landmarks.cbd[k] = cbds;
  stripCanvases[k] = cv;
}

// ===== ジオメトリ生成ヘルパ =====
function stripPatch(r, phi, uvFn, withDuv) {
  const segT = 96, segZ = 48, pos = [], nor = [], uv = [], duv = [], idx = [];
  for (let iz = 0; iz <= segZ; iz++) {
    const z = -HL + L * iz / segZ;
    for (let it = 0; it <= segT; it++) {
      const s = -STRIP_W / 2 + STRIP_W * it / segT, th = phi + s / R, c = Math.cos(th), sn = Math.sin(th);
      pos.push(r * c, r * sn, z); nor.push(-c, -sn, 0);
      uv.push(...uvFn(s, z, it / segT, iz / segZ));
      if (withDuv) duv.push(s / P, z / P + 0.5);
    }
  }
  for (let iz = 0; iz < segZ; iz++) for (let it = 0; it < segT; it++) {
    const a = iz * (segT + 1) + it, b = a + 1, c = a + segT + 1, d = c + 1;
    idx.push(a, c, b, b, c, d); // 内側（軸方向）を表にする
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  if (withDuv) geo.setAttribute('duv', new THREE.Float32BufferAttribute(duv, 2));
  geo.setIndex(idx);
  return geo;
}

class GeoBuilder {
  constructor() { this.p = []; this.n = []; }
  quad(a, b, c, d, n) {
    const cr = new THREE.Vector3().crossVectors(b.clone().sub(a), c.clone().sub(a));
    const pts = cr.dot(n) >= 0 ? [a, b, c, a, c, d] : [a, c, b, a, d, c];
    for (const q of pts) { this.p.push(q.x, q.y, q.z); this.n.push(n.x, n.y, n.z); }
  }
  // 円筒に沿った帯状の箱（上面 rTop < 下面 rBot）
  ringBand(rTop, rBot, z0, z1, th0, th1, seg) {
    const ZN = new THREE.Vector3(0, 0, -1), ZP = new THREE.Vector3(0, 0, 1);
    for (let i = 0; i < seg; i++) {
      const ta = th0 + (th1 - th0) * i / seg, tb = th0 + (th1 - th0) * (i + 1) / seg, tm = (ta + tb) / 2;
      const up = new THREE.Vector3(-Math.cos(tm), -Math.sin(tm), 0), out = up.clone().negate();
      this.quad(cyl(rTop, ta, z0), cyl(rTop, tb, z0), cyl(rTop, tb, z1), cyl(rTop, ta, z1), up);
      this.quad(cyl(rBot, ta, z0), cyl(rBot, tb, z0), cyl(rBot, tb, z1), cyl(rBot, ta, z1), out);
      this.quad(cyl(rTop, ta, z0), cyl(rTop, tb, z0), cyl(rBot, tb, z0), cyl(rBot, ta, z0), ZN);
      this.quad(cyl(rTop, ta, z1), cyl(rTop, tb, z1), cyl(rBot, tb, z1), cyl(rBot, ta, z1), ZP);
    }
  }
  geo() {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(this.p, 3));
    g.setAttribute('normal', new THREE.Float32BufferAttribute(this.n, 3));
    return g;
  }
}

function instanced(geo, mat, recs, stride, { cast = true, color = true } = {}) {
  const n = recs.length / stride;
  if (!n) return null;
  const m = new THREE.InstancedMesh(geo, mat, n);
  const col = new THREE.Color();
  for (let q = 0; q < n; q++) {
    const o = q * stride;
    writeBox(m.instanceMatrix.array, q * 16, recs[o], recs[o + 1], recs[o + 2], recs[o + 3], recs[o + 4], recs[o + 5]);
    if (color) m.setColorAt(q, col.setHex(recs[o + 6]));
  }
  m.instanceMatrix.needsUpdate = true;
  m.computeBoundingSphere();
  m.castShadow = cast; m.receiveShadow = true;
  return m;
}

// ===== シーン構築 =====
const lodChunks = [];
const vehicles = { cars: [], trains: [] };

function build() {
  for (let k = 0; k < 3; k++) genStrip(k);

  // 地面（遠景は街区・屋根・公園を焼き込んだテクスチャでごまかす）
  for (let k = 0; k < 3; k++) {
    const tex = new THREE.CanvasTexture(stripCanvases[k]);
    tex.colorSpace = THREE.SRGBColorSpace; tex.flipY = false; tex.anisotropy = ANISO;
    const mat = patch(new THREE.MeshStandardMaterial({ map: tex, roughness: 0.95 }), { ground: true });
    mat.userData.neon = landmarks.neonTex[k];
    const mesh = new THREE.Mesh(stripPatch(R, STRIP_PHI[k], (s, z, u, v) => [u, v], true), mat);
    mesh.receiveShadow = true;
    scene.add(mesh);
  }

  // 建物・屋根・木（チャンク単位で近景/遠景を切替）
  for (const c of chunks.values()) {
    const sMid = c.sSum / c.n, zMid = c.zSum / c.n;
    const near = new THREE.Group(), far = new THREE.Group();
    const b = instanced(GEO.box, M.bld, c.bld, 7); if (b) near.add(b);
    const r = instanced(GEO.roof, M.roof, c.roof, 7); if (r) near.add(r);
    const t = instanced(GEO.tree, M.tree, c.tree, 7); if (t) near.add(t);
    c.treeLow = t;
    const f = instanced(GEO.box, M.bld, c.far, 7, { cast: false }); if (f) far.add(f);
    const cy = instanced(GEO.cyl, M.tank, c.cyl, 7); if (cy) near.add(cy);
    const cyF = instanced(GEO.cyl, M.tank, c.cyl, 7, { cast: false }); if (cyF) far.add(cyF);
    const sw = instanced(GEO.saw, M.roof, c.saw, 7); if (sw) near.add(sw);
    const pc = instanced(GEO.car, M.carShape, c.car, 7, { cast: false }); if (pc) near.add(pc);
    scene.add(near, far);
    lodChunks.push({ center: cyl(R, STRIP_PHI[c.k] + sMid / R, zMid), near, far, src: c, detail: null, seed: lodChunks.length + 1 });
  }
  scene.add(instanced(GEO.box, M.water, waterRecs, 6, { cast: false, color: false }));
  buildNeonSigns();

  // 窓ガラス（遠くほど霧で不透明化 = 大気越しの空色）
  const [gc, gg] = canvas(128, 128);
  gg.fillStyle = 'rgba(170,205,235,0.07)'; gg.fillRect(0, 0, 128, 128);
  gg.fillStyle = 'rgba(70,76,86,1)'; gg.fillRect(0, 0, 128, 4); gg.fillRect(0, 0, 4, 128);
  const glassTex = new THREE.CanvasTexture(gc);
  glassTex.wrapS = glassTex.wrapT = THREE.RepeatWrapping; glassTex.anisotropy = ANISO; glassTex.colorSpace = THREE.SRGBColorSpace;
  const glassMat = new THREE.MeshBasicMaterial({ map: glassTex, transparent: true, depthWrite: false, side: THREE.DoubleSide });
  glassMat.onBeforeCompile = sh => {
    sh.uniforms.uEnv = U.uEnv; sh.uniforms.uSpace = U.uSpace;
    sh.vertexShader = 'varying vec3 vGW; varying vec3 vGN;\n' + sh.vertexShader.replace('#include <project_vertex>',
      '#include <project_vertex>\n vGW = (modelMatrix * vec4(transformed, 1.0)).xyz; vGN = normalize(mat3(modelMatrix) * normal);');
    sh.fragmentShader = 'varying vec3 vGW; varying vec3 vGN; uniform samplerCube uEnv; uniform float uSpace;\n' + sh.fragmentShader.replace('#include <opaque_fragment>', `{
        vec3 V = normalize(vGW - cameraPosition), N = normalize(vGN);
        if (dot(N, V) > 0.0) N = -N;
        float fr = clamp(0.06 + 0.94 * pow(1.0 - abs(dot(N, V)), 5.0), 0.0, 1.0) * (1.0 - uSpace); // 環境マップは内側から撮ったものなので外からは使わない
        fr *= 0.6;                                     // 浅い角度で窓全体が白飛びしないよう映り込みを抑える
        outgoingLight = mix(outgoingLight, textureCube(uEnv, reflect(V, N)).rgb * 0.8, fr);
        diffuseColor.a = max(diffuseColor.a, fr);
      }
      #include <opaque_fragment>`);
    sh.fragmentShader = sh.fragmentShader.replace('#include <fog_fragment>',
      '#include <fog_fragment>\n#ifdef USE_FOG\n gl_FragColor.a = max(gl_FragColor.a, fogFactor * 0.97);\n#endif');
  };
  for (const psi of WIN_PHI) { const gm = new THREE.Mesh(stripPatch(GLASS_R, psi, (s, z) => [s / 45, z / 45], false), glassMat); glassMeshes.push(gm); scene.add(gm); }

  // 構造物: 陸地の縁の壁・橋・環状高架・軸方向高架・柱
  const conc = new GeoBuilder(), deck = new GeoBuilder();
  const misc = [];
  for (let k = 0; k < 3; k++) {
    const phi = STRIP_PHI[k];
    for (const sg of [-1, 1]) {
      const te = phi + sg * SECTOR / 2, n = new THREE.Vector3(-Math.sin(te), Math.cos(te), 0).multiplyScalar(sg);
      conc.quad(cyl(R, te, -HL), cyl(R, te, HL), cyl(GLASS_R, te, HL), cyl(GLASS_R, te, -HL), n);
      misc.push(te - sg * 0.4 / R, 0, 0, 0.4, 1.1, L); // 手すり
    }
    misc.push(phi, 0, 6.5, 8, 1.5, L); // 軸方向の高架鉄道
    for (let z = -HL + 40; z < HL; z += 50) misc.push(phi, z, 0, 1.6, 6.5, 1.6);
  }
  for (const zb of BRIDGE_Z) {
    conc.ringBand(R - 16, R - 14.5, zb - 4.5, zb + 4.5, 0, TAU, 360); // 環状高架鉄道
    for (let a = 0; a < TAU; a += 60 / R) {
      if (isLand(a) && Math.abs(angDiff(a, STRIP_PHI[stripOf(a)])) * R < 8) continue;
      misc.push(a, zb, 0, 1.8, 14.5, 1.8);
    }
    for (const psi of WIN_PHI) {
      const t0 = psi - SECTOR / 2 - 0.003, t1 = psi + SECTOR / 2 + 0.003;
      deck.ringBand(R, R + 2.5, zb - 10, zb + 10, t0, t1, 64);   // 窓をまたぐ橋（道路）
      conc.ringBand(R - 0.03, R, zb - 0.15, zb + 0.15, t0, t1, 64); // センターライン
      conc.ringBand(R - 1.1, R, zb - 10, zb - 9.6, t0, t1, 64);
      conc.ringBand(R - 1.1, R, zb + 9.6, zb + 10, t0, t1, 64);
      for (let a = psi - SECTOR / 2 + 0.02; a < psi + SECTOR / 2; a += 130 / R)
        for (const dz of [-8, 8]) misc.push(a, zb + dz, -(GLASS_R - R), 1.2, GLASS_R - R - 2.5, 1.2);
    }
  }
  const concMesh = new THREE.Mesh(conc.geo(), M.concrete); concMesh.receiveShadow = concMesh.castShadow = true;
  const deckMesh = new THREE.Mesh(deck.geo(), M.deck); deckMesh.receiveShadow = deckMesh.castShadow = true;
  const miscMesh = instanced(GEO.box, M.concrete, misc, 6, { color: false });
  scene.add(concMesh, deckMesh, miscMesh);
  envHide.push(concMesh, deckMesh, miscMesh);

  // 街灯: 川の両岸（30mおき）と橋の両側の歩道（40mおき）。支柱・灯具・足元の光だまり
  const lampAt = [];
  for (let k = 0; k < 3; k++) for (const side of [-1, 1]) {
    const th = STRIP_PHI[k] + (sCenter(RIVER_I[k]) + side * (RIVER_HW + 1.5)) / R;
    for (let z = -HL + 60; z < HL - 60; z += 30) lampAt.push([th, z]);
  }
  for (const zb of BRIDGE_Z) for (const psi of WIN_PHI) for (const dz of [-9.2, 9.2])
    for (let a = psi - SECTOR / 2 + 20 / R; a < psi + SECTOR / 2; a += 40 / R) lampAt.push([a, zb + dz]);
  // 大きな公園: 園路（各街区の対角線）に街灯、木のまわりを落ち着いた暖色でライトアップ
  const glowR = [];
  const glowCols = [0xffc98a, 0xffb877, 0xffd6a0, 0xf0b070];
  for (let k = 0; k < 3; k++) for (const pr of landmarks.parkRects[k]) for (let i = pr.i0; i <= pr.i1; i++) for (let j = pr.j0; j <= pr.j1; j++) {
    const sc = sCenter(i), zc = zCenter(j);
    for (const dg of [1, -1]) for (let u = -0.42; u <= 0.42; u += 0.14) lampAt.push([STRIP_PHI[k] + (sc + u * BLK + 2.5) / R, zc + dg * u * BLK]);
    for (let n = 0; n < 7; n++) glowR.push(STRIP_PHI[k] + (sc + rr(-0.42, 0.42) * BLK) / R, zc + rr(-0.42, 0.42) * BLK, -0.08, rr(14, 22), 1, rr(14, 22), pick(glowCols));
  }
  const postR = [], headR = [], poolR = [];
  for (const [th, z] of lampAt) { postR.push(th, z, 0, 0.25, 7, 0.25); headR.push(th, z, 7, 0.9, 0.25, 0.55); poolR.push(th, z, -0.06, 16, 1, 16); }
  scene.add(instanced(GEO.box, M.steel, postR, 6, { color: false, cast: false }));
  lampHeadMat = new THREE.MeshBasicMaterial({ color: 0x9a9a9a });
  scene.add(instanced(GEO.box, lampHeadMat, headR, 6, { color: false, cast: false }));
  lampPoolMat = new THREE.MeshBasicMaterial({
    map: gradientSprite([[0, 'rgba(255,214,150,1)'], [0.35, 'rgba(255,190,120,0.45)'], [1, 'rgba(255,170,100,0)']]),
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, opacity: 0, polygonOffset: true, polygonOffsetFactor: -2,
  });
  lampPools = instanced(new THREE.PlaneGeometry(1, 1).rotateX(-Math.PI / 2), lampPoolMat, poolR, 6, { color: false, cast: false });
  lampPools.visible = false; lampPools.renderOrder = 2;
  parkGlowMat = new THREE.MeshBasicMaterial({
    map: gradientSprite([[0, 'rgba(255,255,255,1)'], [0.4, 'rgba(255,255,255,0.4)'], [1, 'rgba(255,255,255,0)']]),
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, opacity: 0, polygonOffset: true, polygonOffsetFactor: -2,
  });
  parkGlow = instanced(new THREE.PlaneGeometry(1, 1).rotateX(-Math.PI / 2), parkGlowMat, glowR, 7, { cast: false });
  parkGlow.visible = false; parkGlow.renderOrder = 2;
  scene.add(parkGlow);
  scene.add(lampPools);

  // 両端のキャップ（陸地は段々の丘、窓部分は暗いガラス）
  const capR = GLASS_R + 5;
  for (const zc of [-HL, HL]) {
    const mirror = zc > 0;
    const [cc, cg] = canvas(1024, 1024);
    const P2 = (a, r) => { const aa = mirror ? Math.PI - a : a; return [512 + r * 512 * Math.cos(aa), 512 - r * 512 * Math.sin(aa)]; };
    const wedge = (a0, a1, r0, r1, col) => {
      cg.fillStyle = col; cg.beginPath();
      for (let n = 0; n <= 24; n++) cg.lineTo(...P2(a0 + (a1 - a0) * n / 24, r1));
      for (let n = 24; n >= 0; n--) cg.lineTo(...P2(a0 + (a1 - a0) * n / 24, r0));
      cg.closePath(); cg.fill();
    };
    cg.fillStyle = '#6f757e'; cg.fillRect(0, 0, 1024, 1024);
    for (let k = 0; k < 3; k++) {
      const a0 = STRIP_PHI[k] - SECTOR / 2, a1 = STRIP_PHI[k] + SECTOR / 2;
      for (let r = R / capR, n = 0; r > 0.5; r -= 0.035, n++) wedge(a0, a1, r - 0.035, r, n % 2 ? '#4a4f56' : '#8a9099');
      wedge(WIN_PHI[k] - SECTOR / 2, WIN_PHI[k] + SECTOR / 2, 0.5, 1, '#122036');
      for (let n = 1; n < 6; n++) { const a = WIN_PHI[k] - SECTOR / 2 + SECTOR * n / 6; wedge(a - 0.004, a + 0.004, 0.5, 1, '#3a414c'); }
    }
    for (let n = 0; n < 12; n++) wedge(n * TAU / 12 - 0.01, n * TAU / 12 + 0.01, 0.05, 0.5, '#565c64');
    wedge(0, TAU, 0, 0.05, '#2b2f35');
    const tex = new THREE.CanvasTexture(cc); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = ANISO;
    const geo = new THREE.CircleGeometry(capR, 120);
    if (mirror) geo.rotateY(Math.PI);
    geo.translate(0, 0, zc);
    scene.add(new THREE.Mesh(geo, patch(new THREE.MeshStandardMaterial({ map: tex, roughness: 1 }))));
  }

  buildElevators();
  buildLandmarks();
  buildHubStation();

  // 中心軸の構造物
  const spine = new THREE.Mesh(new THREE.CylinderGeometry(14, 14, L, 16, 1, true).rotateX(Math.PI / 2), M.steel);
  scene.add(spine);
  const ringRecs = [];
  for (let z = -HL + 500; z < HL; z += 1000) for (let a = 0; a < TAU; a += TAU / 8) ringRecs.push(a, z, R - 30, 8, 16, 6);
  for (let n = 0; n < 4; n++) ringRecs.push(AXIS_TRACK_A0 + n * TAU / 4, 0, R - 52, 5, 1.5, L - 300); // 軸電車のレール
  scene.add(instanced(GEO.box, M.steel, ringRecs, 6, { cast: false, color: false }));

  // 雲: 柔らかい玉（常にカメラを向くビルボード）を十数個ずつ固めた積雲。上面は明るく底は影色
  clouds = buildClouds();
  scene.add(clouds.mesh);

  // ===== 宇宙側: 星・外側ミラー・反射した太陽 =====
  const nStar = LOW ? 3000 : 7000, sp = new Float32Array(nStar * 3), sc = new Float32Array(nStar * 3), v = new THREE.Vector3();
  for (let n = 0; n < nStar; n++) {
    v.randomDirection().multiplyScalar(60000); sp.set([v.x, v.y, v.z], n * 3);
    const b = 0.35 + 0.65 * rand() ** 3, tint = rand();
    sc.set([b * (0.85 + 0.15 * tint), b * 0.92, b * (1.05 - 0.15 * tint)], n * 3);
  }
  const sg = new THREE.BufferGeometry();
  sg.setAttribute('position', new THREE.BufferAttribute(sp, 3)); sg.setAttribute('color', new THREE.BufferAttribute(sc, 3));
  stars = new THREE.Points(sg, new THREE.PointsMaterial({ size: 1.6, sizeAttenuation: false, vertexColors: true, fog: false, depthWrite: false })); // 最初に描くので深度は不要（深度を書くと被写界深度でボケる）
  stars.renderOrder = -1; stars.frustumCulled = false;
  spaceFrame.add(stars);
  buildExterior();

  const [mc, mg] = canvas(128, 1024);
  const mgr = mg.createLinearGradient(0, 0, 0, 1024);
  mgr.addColorStop(0, '#0b1222'); mgr.addColorStop(0.7, '#1b2742'); mgr.addColorStop(1, '#55617a');
  mg.fillStyle = mgr; mg.fillRect(0, 0, 128, 1024);
  mg.fillStyle = 'rgba(120,135,160,0.25)';
  for (let y = 0; y < 1024; y += 32) mg.fillRect(0, y, 128, 2);
  for (let x = 0; x < 128; x += 32) mg.fillRect(x, 0, 2, 1024);
  mg.fillStyle = '#8a929e'; mg.fillRect(0, 0, 3, 1024); mg.fillRect(125, 0, 3, 1024);
  const mirrorTex = new THREE.CanvasTexture(mc); mirrorTex.colorSpace = THREE.SRGBColorSpace;
  // ミラーは細長い板を並べたすだれ状（板のすき間から星が見える。夜に閉じても完全にはふさがない）
  const [slatCv, sg2] = canvas(512, 4);
  sg2.fillStyle = '#fff'; sg2.fillRect(0, 0, 512, 4); sg2.fillStyle = '#000';
  for (let n = 0; n < 16; n++) sg2.fillRect(n * 32 + 26, 0, 6, 4);
  const slatTex = new THREE.CanvasTexture(slatCv);
  const mirrorMat = new THREE.MeshBasicMaterial({ map: mirrorTex, alphaMap: slatTex, alphaTest: 0.5, side: THREE.BackSide, fog: false, depthWrite: false }); // 窓に向いた鏡面
  // 太陽（+z の彼方）の光が鏡で反射してカメラに届く向きだと強く光る
  mirrorMat.onBeforeCompile = sh => {
    sh.uniforms.uMirrorSun = mirrorSun; sh.uniforms.uMirrorSpace = mirrorSpace;
    sh.vertexShader = 'varying vec3 vMW; varying vec3 vMN;\n' + sh.vertexShader.replace('#include <project_vertex>',
      '#include <project_vertex>\n vMW = (modelMatrix * vec4(transformed, 1.0)).xyz; vMN = -normalize(mat3(modelMatrix) * normal);');
    sh.fragmentShader = 'varying vec3 vMW; varying vec3 vMN; uniform float uMirrorSun; uniform float uMirrorSpace;\n' + sh.fragmentShader.replace('#include <opaque_fragment>', `{
        vec3 r = reflect(vec3(0.0, 0.0, -1.0), normalize(vMN));      // 太陽光（-z へ進む）の反射方向
        float g = max(dot(r, normalize(cameraPosition - vMW)), 0.0);
        // 正反射の向き（反射光はコロニーの窓へ入るので外からはほぼ見えない）＋ 太陽に照らされた鏡面の明るいにじみ
        float lit = max(dot(normalize(vMN), vec3(0.0, 0.0, 1.0)), 0.0);
        outgoingLight += vec3(1.0, 0.95, 0.85) * (pow(g, 80.0) * 6.0 + pow(g, 3.0) * 0.9 * lit + lit * 0.35) * uMirrorSun;
        outgoingLight += vec3(1.0, 0.96, 0.88) * uMirrorSpace * (lit * 5.0 + pow(g, 2.0) * 6.0 + pow(g, 30.0) * 20.0); // 宇宙からの全景では太陽光を照り返してビカビカ光る
      }
      #include <opaque_fragment>`);
  };
  // 鏡の裏（宇宙側）: 何も映さないくすんだ構造パネル
  const [bc, bg] = canvas(128, 1024);
  bg.fillStyle = '#3c4148'; bg.fillRect(0, 0, 128, 1024);
  bg.fillStyle = '#2a2e34'; for (let y = 0; y < 1024; y += 32) bg.fillRect(0, y, 128, 3); for (let x = 0; x < 128; x += 32) bg.fillRect(x, 0, 3, 1024);
  bg.fillStyle = '#555b63'; for (let y = 16; y < 1024; y += 128) bg.fillRect(0, y, 128, 8);
  const backTex = new THREE.CanvasTexture(bc); backTex.colorSpace = THREE.SRGBColorSpace;

function updatePlayer(dt) {
  const { up, east, north, f, right, mv } = V;
  up.set(-Math.cos(player.th), -Math.sin(player.th), 0);

  if (keys.has('KeyS') || keys.has('ArrowDown')) mv.sub(f);
  if (keys.has('KeyD') || keys.has('ArrowRight')) mv.add(right);
  if (keys.has('KeyA') || keys.has('ArrowLeft')) mv.sub(right);
  let vert = 0;

const mm = document.getElementById('minimap'), mg = mm.getContext('2d');
const MW = mm.width, MH = mm.height;
let mmBase;
function drawMinimapBase() {
  const [c, g] = canvas(MW, MH);
  g.fillStyle = '#0b1426'; g.fillRect(0, 0, MW, MH);
  for (let k = 0; k < 3; k++) {
    const x0 = (STRIP_PHI[k] - SECTOR / 2) / TAU * MW;
    g.drawImage(stripCanvases[k], x0, 0, MW / 6, MH);
  }
  g.fillStyle = 'rgba(200,200,210,0.7)';
  for (const zb of BRIDGE_Z) for (const psi of WIN_PHI) g.fillRect((psi - SECTOR / 2) / TAU * MW, (zb + HL) / L * MH - 0.5, MW / 6, 1);
  mmBase = c;
}
function drawMinimap() {
  mg.drawImage(mmBase, 0, 0);
  const x = normAng(player.th) / TAU * MW, y = (player.z + HL) / L * MH;
  const hx = Math.sin(player.yaw), hy = Math.cos(player.yaw);
  mg.save(); mg.translate(x, y); mg.rotate(Math.atan2(hy, hx) - Math.PI / 2);
  mg.fillStyle = '#ff4d4d'; mg.strokeStyle = '#fff'; mg.lineWidth = 1;
  mg.beginPath(); mg.moveTo(0, 9); mg.lineTo(5, -5); mg.lineTo(-5, -5); mg.closePath(); mg.fill(); mg.stroke();
  mg.restore();
}
mm.addEventListener('click', e => {
  const rc = mm.getBoundingClientRect();
  const th = (e.clientX - rc.left) / rc.width * TAU, z = THREE.MathUtils.clamp((e.clientY - rc.top) / rc.height * L - HL, -HL + 50, HL - 50);
  const k = stripOf(th);
  if (isLand(th)) {
    const s = THREE.MathUtils.clamp(roadS(angDiff(th, STRIP_PHI[k]) * R), -STRIP_W / 2 + 8, STRIP_W / 2 - 8);
    go(STRIP_PHI[k] + s / R, z, EYE, player.yaw, 0.25);
  } else {
    const zb = BRIDGE_Z.reduce((a, b) => Math.abs(b - z) < Math.abs(a - z) ? b : a);
    go(th, zb + 8, EYE, Math.PI / 2, 0.1);
  }
});

// ===== HUD =====
const el = id => document.getElementById(id);
let fpsAcc = 0, fpsN = 0;
function hud(dt) {
  fpsAcc += dt; fpsN++;
  if (fpsAcc < 0.4) return;
  el('s-fps').textContent = Math.round(fpsN / fpsAcc); fpsAcc = 0; fpsN = 0;
  if (space.on) { el('s-loc').textContent = '宇宙空間（コロニーの外）'; el('s-alt').textContent = `距離 ${(space.dist / 1000).toFixed(1)} km`; el('s-spd').textContent = '-'; return; }
  const k = stripOf(player.th);
  el('s-loc').textContent = (isLand(player.th) ? `第${k + 1}陸地` : `第${k + 1}窓（橋）`) + ` / 軸方向 ${(player.z / 1000).toFixed(2)} km`;
  el('s-alt').textContent = player.h < 1000 ? `${player.h.toFixed(1)} m` : `${(player.h / 1000).toFixed(2)} km`;
  el('s-spd').textContent = `${(curSpeed * 3.6).toFixed(0)} km/h`;
}

const atSample = (key, h = 85, back = 130) => () => {
  const sp = landmarks.samples[key], sg = sp.s >= 0 ? 1 : -1, cs = sp.s - sg * back * 0.9, cz = sp.z - back;
  go(STRIP_PHI[sp.k] + cs / R, cz, h, Math.atan2(sp.s - cs, sp.z - cz), -Math.atan2(h, Math.hypot(sp.s - cs, sp.z - cz)) * 0.75);
};

const lookAt = (k, as, az, bs, bz, h, pitchK = 0.85) => go(STRIP_PHI[k] + as / R, az, h, Math.atan2(bs - as, bz - az), -Math.atan2(h, Math.hypot(bs - as, bz - az)) * pitchK);
// ターミナル駅: 縦の高架線の真上から交差点を見て、縦の線の電車を1本ホームに止める
function terminalShot() {
  const k = 0, ts = landmarks.terminals[k], t = ts.find(x => x.kind === 'office') || ts[0];
  lookAt(k, 150, t.z - 200, 0, t.z, 280, 1.0);              // ビルより高い位置から交差点を見下ろす
  const tr = vehicles.trains.find(x => !x.ring && x.dir > 0 && Math.abs(x.lane - STRIP_PHI[k]) < 0.01);
  if (tr && tr.stops) {
    const idS = STATIONS.axial.findIndex(z => Math.abs(z - t.z) < 1), stopU = tr.stops[idS];
    tr.u = Math.floor(tr.u / tr.span) * tr.span + stopU - 650; tr.spd = tr.cruise; tr.wait = 0;
    tr.decided = Math.floor(tr.u / tr.span) * 100 + idS; tr.stopHere = true;
  }
}

function epiano(t, note, vel, len) {                  // エレピ: サイン＋少しだけ倍音、速い立ち上がりと長い減衰

const demoEl = { cap: el('demo-cap'), fade: el('demo-fade'), bar: el('demo-bar') };

{ const b = document.createElement('button'); b.textContent = '▶ ガイドツアー（G）'; b.style.borderColor = '#9fff9f'; b.style.fontWeight = '700'; b.onclick = () => { b.blur(); startDemo(); }; warp.prepend(b); }
